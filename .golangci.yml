version: "2"

# Набор линтеров — по умолчанию. Здесь настроено только форматирование:
# `make fmt` приводит файлы к этому виду, `make fmt-check` (и CI) не пропускает
# неотформатированный файл.
formatters:
  enable:
    - gofumpt
    - goimports
    - golines
  settings:
    gofumpt:
      # Имя модуля без домена, поэтому указываем явно: иначе `code/...`
      # выглядит как пакет стандартной библиотеки.
      module-path: code
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    # Порядок импортов — три группы: стандартная библиотека, пакеты модуля `code`,
    # внешние зависимости. Группу модуля отделяет gofumpt (по module-path): его
    # правило — в верхнем блоке только стандартная библиотека. goimports сортирует
    # импорты внутри групп; local-prefixes ему не нужен.
    golines:
      max-len: 120
